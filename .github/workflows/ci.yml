name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; widen per job, never for the whole workflow.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.14.0'

      - name: Get the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # Rust 1.99.1 with clippy, pinned so a new stable lint cannot fail a build nobody touched.
      - name: Set up Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --no-self-update --force && rustup default 1.99.1

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install Tauri's Linux build packages
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential pkg-config libwebkit2gtk-4.1-dev libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev

      # The Makefile holds the list, so a guard added to `ci` runs here with no second edit.
      - name: Lint, guards, tests and duplication
        run: make ci

      - name: Docs build with no broken link
        run: make docs

      - name: Frontend types, lint, tests and relay
        run: make frontend

      - name: Nothing was skipped
        run: make no-skipped-tests

      - name: Runnable jar builds
        run: make package

  # ubuntu-22.04 sets the deb's glibc floor, so it is pinned rather than latest (ADR 0059).
  bundle:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: '12.14.0'

      - name: Get the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Set up Rust
        run: rustup toolchain install 1.99.1 --profile minimal --no-self-update --force && rustup default 1.99.1

      - name: Cache cargo registry
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # libfuse2 runs the AppImage tooling and xvfb gives the relay a display; the rest is Tauri's own list.
      - name: Install Tauri's Linux build packages and the smoke test's tools
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          build-essential pkg-config libwebkit2gtk-4.1-dev libsoup-3.0-dev
          libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev
          libfuse2 xvfb

      # Keyed on exactly the pins they hold, with no restore-keys, so a bumped pin never reuses the old files.
      - name: Read the Temurin pin and the locked tauri CLI version
        id: bundle-pins
        run: |
          temurin="$(grep -oP '^TEMURIN_SHA256 := \K[0-9a-f]{64}$' Makefile)"
          tauri="$(grep -m1 -oP "^  '@tauri-apps/cli@\K[0-9][^']*(?=':$)" frontend/pnpm-lock.yaml)"
          echo "temurin=${temurin:?no TEMURIN_SHA256 in the Makefile}" >> "$GITHUB_OUTPUT"
          echo "tauri=${tauri:?no @tauri-apps/cli in frontend/pnpm-lock.yaml}" >> "$GITHUB_OUTPUT"

      - name: Restore the Temurin download
        id: temurin-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: target/bundle/download
          key: temurin-${{ runner.os }}-${{ steps.bundle-pins.outputs.temurin }}

      - name: Restore tauri's AppImage tools
        id: tauri-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ~/.cache/tauri
          key: tauri-tools-${{ runner.os }}-${{ steps.bundle-pins.outputs.tauri }}

      - name: Build the deb and the AppImage
        id: bundle
        run: make bundle

      # bundle.sh keeps the archive only once its SHA-256 matched, so it is saved even when the build failed after it.
      - name: Save the Temurin download
        if: always() && steps.temurin-cache.outputs.cache-hit != 'true' && hashFiles('target/bundle/download/*.tar.gz') != ''
        uses: actions/cache/save@v6.1.0
        with:
          path: target/bundle/download
          key: ${{ steps.temurin-cache.outputs.cache-primary-key }}

      # Saved only after a whole bundle, so a tool half-fetched by a failed build is never frozen under its key.
      - name: Save tauri's AppImage tools
        if: steps.bundle.outcome == 'success' && steps.tauri-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ~/.cache/tauri
          key: ${{ steps.tauri-cache.outputs.cache-primary-key }}

      - name: Install the deb
        run: sudo apt-get install -y ./target/bundle/out/*.deb

      - name: Smoke-test the installed deb and the extracted AppImage
        env:
          BUNDLE_SMOKE_INSTALLED: '1'
        run: make bundle-smoke

      - name: Keep the deb and the AppImage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lazyclaude-bundle
          path: |
            target/bundle/out/*.deb
            target/bundle/out/*.AppImage
          if-no-files-found: error
          retention-days: 14
